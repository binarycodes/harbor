# The database Harbor talks to while you are developing it. The credentials are
# harbor/harbor and the port is published on localhost, which is only acceptable
# because this file is for a laptop: nothing here belongs on a machine anyone
# else can reach. A deployment sets HARBOR_DB_URL, HARBOR_DB_USER and
# HARBOR_DB_PASSWORD instead, and the application has no defaults worth trusting
# beyond the ones that match this file.

services:
  postgres:
    image: postgres:18-alpine
    container_name: harbor-dev-postgres
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    ports:
      - "5432:5432"
    volumes:
      - harbor-dev-data:/var/lib/postgresql
    # The app starts fast enough to beat Postgres to it, and Flyway's first
    # migration is what pays for that with a confusing connection error.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Harbor archives every page it saves and refuses to save one it cannot archive,
  # so this is not optional in development either.
  chromium:
    build: ../chromium
    container_name: harbor-dev-chromium
    ports:
      - "9222:9222"
    # A browser rendering pages from the open web wants a hard ceiling: Chromium
    # treats /dev/shm as its scratch space and the default 64 MB is too little,
    # while an unbounded browser can take the whole machine.
    shm_size: 512m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9222' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  harbor-dev-data:
