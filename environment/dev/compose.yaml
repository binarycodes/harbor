# The three services Harbor talks to while you are developing it: its database, the
# browser it archives with, and the identity provider it authenticates against.
#
# Every credential here is published and guessable — harbor/harbor on a published
# 5432, admin/admin on the Keycloak console, a client secret in version control and a
# client that will redirect anywhere at all. That is only acceptable because this
# file is for a laptop: nothing here belongs on a machine anyone else can reach. A
# deployment sets HARBOR_DB_URL, HARBOR_DB_USER, HARBOR_DB_PASSWORD,
# HARBOR_BROWSER_URL and the HARBOR_OIDC_* trio against a realm of its own, and the
# application has no defaults worth trusting beyond the ones that match this file.

services:
  postgres:
    image: postgres:18-alpine
    container_name: harbor-dev-postgres
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    ports:
      - "5432:5432"
    volumes:
      - harbor-dev-data:/var/lib/postgresql
    # The app starts fast enough to beat Postgres to it, and Flyway's first
    # migration is what pays for that with a confusing connection error.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Harbor archives every page it saves and refuses to save one it cannot archive,
  # so this is not optional in development either.
  # chromedp's headless-shell rather than an image of our own: Chromium binds its
  # DevTools port to loopback whatever --remote-debugging-address says, and this image
  # already carries the forwarder that works around it — which is why it exposes both
  # 9222 and 9223. Pinned to a version rather than :stable so an upgrade is a commit.
  chromium:
    image: chromedp/headless-shell:151.0.7922.109
    container_name: harbor-dev-chromium
    ports:
      - "9222:9222"
    # A browser rendering pages from the open web wants a hard ceiling: Chromium
    # treats /dev/shm as its scratch space and the default 64 MB is too little,
    # while an unbounded browser can take the whole machine.
    shm_size: 512m
    mem_limit: 1g
    # Probed on the address the app will actually use, not 127.0.0.1: a browser bound
    # only to loopback passes a loopback check and is still unreachable, which is
    # exactly the failure this is here to catch.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/$$(hostname -i)/9222' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Who Harbor asks about the reader. Login is mandatory on every route, so this is
  # as required as the database — the app fetches the issuer's discovery document at
  # startup and will not start without it.
  #
  # Started empty. The realm, its client and its one reader are created afterwards by
  # keycloak-init, over the admin REST API.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: harbor-dev-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The readiness endpoint lives on the management port, and only when asked for.
      KC_HEALTH_ENABLED: "true"
    # 8081, because Keycloak's own default is Harbor's. The management port is not
    # published: only the healthcheck below reaches it, from inside the container.
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/HealthCheck.java:/tmp/HealthCheck.java:ro
    # This image carries no curl and no wget, but it does carry a JVM — so the probe is
    # a single Java source file. It asks /health/ready rather than testing whether a
    # port is open, because Keycloak binds its ports long before it can answer, and
    # keycloak-init below depends on this being true rather than merely started.
    healthcheck:
      test: ["CMD", "java", "/tmp/HealthCheck.java", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the realm, once, and exits. A script against the admin REST API rather
  # than a realm export imported at boot: an export has to be an exactly correct
  # RealmRepresentation or the container refuses to start, and says so through a
  # Jackson field error that names nothing about Keycloak. Here a mistake is an HTTP
  # 400 that names the field. Re-running is safe: each step looks up what it would
  # create and skips it if it is already there.
  keycloak-init:
    image: node:24-alpine
    container_name: harbor-dev-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USERNAME: admin
      KC_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/init.mjs:/tmp/init.mjs:ro
    entrypoint: ["node", "/tmp/init.mjs"]
    # It is meant to exit. Without this, compose restarts a container that has done its
    # job and `up --wait` never settles.
    restart: "no"

volumes:
  harbor-dev-data:
