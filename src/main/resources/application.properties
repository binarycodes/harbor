spring.application.name=harbor

# The container's HEALTHCHECK probes ${PORT:-8080}, so the app has to follow the
# same variable or a non-default PORT leaves the probe polling a port nothing
# listens on.
server.port=${PORT:8080}

# The library is in the database now, so a restart costs nothing but the Vaadin
# session. Keep that alive long enough that a tab left open over lunch still
# works.
server.servlet.session.timeout=8h

# Opt-in, because X-Forwarded-* headers are client-supplied: trusting them when
# nothing sits in front lets anyone claim their connection was HTTPS. Set
# FORWARD_HEADERS_STRATEGY=native when a reverse proxy terminates TLS — the app
# only sees plain HTTP from it, so without this it treats every request as
# insecure and Spring Security never emits Strict-Transport-Security.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Saving a link makes the server fetch it, so a pasted URL reaches whatever the
# server can reach. The refused ranges default to ReservedAddressRanges, which is
# where each one is justified; setting harbor.fetch.blocked-ranges here would replace
# that list rather than add to it. This is the way past it instead, for a deployment
# whose own hosts are private: HARBOR_ALLOWED_RANGES=192.168.1.50/32 permits exactly
# that NAS and nothing else.
harbor.fetch.allowed-ranges=${HARBOR_ALLOWED_RANGES:}

# The library lives here. The defaults match environment/dev/compose.yaml so a
# checkout runs with no configuration; every deployment must set all three,
# because these credentials are a laptop's and nothing else's.
spring.datasource.url=${HARBOR_DB_URL:jdbc:postgresql://localhost:5432/harbor}
spring.datasource.username=${HARBOR_DB_USER:harbor}
spring.datasource.password=${HARBOR_DB_PASSWORD:harbor}

# Who is reading. Login is mandatory on every route, and the subject Keycloak
# issues is the owner of every row that reader writes. The defaults match the
# keycloak service in environment/dev/compose.yaml so a checkout runs with no
# configuration; every deployment must set its own, because this client secret is
# a laptop's and nothing else's.
#
# The issuer is fetched at startup, for OIDC discovery, so an identity provider
# that is down means an application that will not start — the same bargain
# harbor.archive.browser-url already makes with the browser.
spring.security.oauth2.client.registration.keycloak.client-id=${HARBOR_OIDC_CLIENT_ID:harbor}
spring.security.oauth2.client.registration.keycloak.client-secret=${HARBOR_OIDC_CLIENT_SECRET:harbor-dev-secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${HARBOR_OIDC_ISSUER_URI:http://localhost:8081/realms/harbor}

# Flyway owns the schema. Hibernate only checks that the entity still matches it,
# so a mismatch fails startup instead of being quietly rewritten underneath a
# running deployment.
spring.jpa.hibernate.ddl-auto=validate

# There is no view rendered inside the request for a session to stay open for —
# Vaadin renders from its own thread — and leaving it on hides a lazy-loading
# mistake until it reaches production.
spring.jpa.open-in-view=false

# The browser that renders the archive. Harbor archives every page it saves and
# refuses to save one it cannot archive, so there is no default worth guessing here:
# without this the application will not start. The value matches the chromium service
# in environment/dev/compose.yaml.
harbor.archive.browser-url=${HARBOR_BROWSER_URL:}
harbor.archive.browser-timeout=${HARBOR_BROWSER_TIMEOUT:30s}
harbor.archive.viewport-width=${HARBOR_BROWSER_VIEWPORT:1280}

logging.level.io.binarycodes.harbor=INFO
