spring.application.name=harbor

# Harbor stores everything in the browser, so the only thing a restart may not
# survive is the Vaadin session. Keep the session alive long enough that a tab
# left open over lunch still works.
server.servlet.session.timeout=8h

# The container serves plain HTTP on 8080 and something in front terminates TLS.
# Without this the application believes every request is insecure, so Spring
# Security never emits Strict-Transport-Security and redirects would come back as
# http://. Only honour these headers because the proxy is the sole way in.
server.forward-headers-strategy=framework

logging.level.io.binarycodes.harbor=INFO
