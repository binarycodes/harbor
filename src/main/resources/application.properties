spring.application.name=harbor

# Harbor stores everything in the browser, so the only thing a restart may not
# survive is the Vaadin session. Keep the session alive long enough that a tab
# left open over lunch still works.
server.servlet.session.timeout=8h

# Opt-in, because X-Forwarded-* headers are client-supplied: trusting them when
# nothing sits in front lets anyone claim their connection was HTTPS. Set
# FORWARD_HEADERS_STRATEGY=native when a reverse proxy terminates TLS — the app
# only sees plain HTTP from it, so without this it treats every request as
# insecure and Spring Security never emits Strict-Transport-Security.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

logging.level.io.binarycodes.harbor=INFO
