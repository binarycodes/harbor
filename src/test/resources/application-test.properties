# What every Spring test needs before the context will start, in one place rather
# than a @TestPropertySource line per class. Activated with @ActiveProfiles("test").
#
# A profile file rather than application.properties: that name would shadow the main
# file wholesale and take the datasource and Flyway settings out with it.

# Harbor refuses to start without a browser to archive with. These tiers stub
# MetadataResolver and never reach one, so this is an address that must not resolve —
# a reachable default would turn a wiring mistake into a silent network call.
harbor.archive.browser-url=http://archiver.invalid:9222

# The OAuth2 client has to exist for the filter chain to build at all: without a
# ClientRegistrationRepository, oauth2LoginPage(...) fails at context startup.
#
# Explicit endpoints rather than issuer-uri, deliberately: an issuer is fetched at
# startup, which would make every test in the suite perform OIDC discovery over the
# network. Nothing here is ever called — the tiers that need an authenticated reader
# install one directly — so these point at a host that cannot resolve, and the secret
# is a placeholder rather than anything's real one.
#
# HarborJourneyIT replaces the issuer, the client id and the secret with the Keycloak it
# starts for itself. It has to replace all three: the client it registers there is its
# own, and presenting the placeholder secret to it would fail as invalid_client.
spring.security.oauth2.client.registration.keycloak.client-id=harbor
spring.security.oauth2.client.registration.keycloak.client-secret=test-only
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://identity.invalid/realms/harbor/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://identity.invalid/realms/harbor/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://identity.invalid/realms/harbor/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://identity.invalid/realms/harbor/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
