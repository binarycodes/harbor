# What every Spring test needs before the context will start, in one place rather
# than a @TestPropertySource line per class. Activated with @ActiveProfiles("test").
#
# A profile file rather than application.properties: that name would shadow the main
# file wholesale and take the datasource and Flyway settings out with it.

# Harbor refuses to start without a browser to archive with. These tiers stub
# MetadataResolver and never reach one, so this is an address that must not resolve —
# a reachable default would turn a wiring mistake into a silent network call.
harbor.archive.browser-url=http://archiver.invalid:9222

# The OAuth2 client has to exist for the filter chain to build at all: without a
# ClientRegistrationRepository, oauth2LoginPage(...) fails at context startup.
#
# Explicit endpoints rather than an issuer, deliberately: an issuer is fetched at
# startup, which would make every test in the suite do OIDC discovery over the network.
# Nothing here is ever called — the tiers that need an authenticated reader install one
# directly — so these point at a host that cannot resolve, and the secret is a
# placeholder rather than anything's real one.
#
# The `provider` line is what makes that possible, and it is the whole trick. The main
# application.properties defines provider.oidc.issuer-uri; a profile file layers on
# top and cannot remove a key; and the mapper prefers an issuer over explicit endpoints
# whenever the provider it is pointed at has one. Blanking the issuer does not work
# either — an empty issuer fails as "issuer cannot be empty". So the registration is
# pointed at a *different* provider instead, and the inherited issuer is simply left
# unreferenced.
#
# The registration id stays `oidc`, because that is what builds the callback path and
# what SecurityConfig names. Only the provider behind it changes.
#
# HarborJourneyIT does not use this profile at all. It runs a real provider and supplies
# its own issuer, client id and secret — see application-journey.properties.
spring.security.oauth2.client.registration.oidc.client-id=harbor
spring.security.oauth2.client.registration.oidc.client-secret=test-only
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.oidc.provider=offline
spring.security.oauth2.client.provider.offline.authorization-uri=http://identity.invalid/authorize
spring.security.oauth2.client.provider.offline.token-uri=http://identity.invalid/token
spring.security.oauth2.client.provider.offline.user-info-uri=http://identity.invalid/userinfo
spring.security.oauth2.client.provider.offline.jwk-set-uri=http://identity.invalid/jwks
spring.security.oauth2.client.provider.offline.user-name-attribute=preferred_username
