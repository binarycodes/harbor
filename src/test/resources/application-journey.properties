# For HarborJourneyIT alone, which is the one tier that authenticates for real.
#
# Deliberately NOT the "test" profile. That one exists to guarantee no test reaches a
# network: it points the OAuth2 registration at a provider whose endpoints cannot
# resolve. This tier wants the opposite — a real Keycloak, a real login form, a real
# token exchange — so it takes the OAuth2 client from the main application.properties
# and lets HarborIdentity supply the issuer and the client through
# @DynamicPropertySource. Sharing the "test" profile meant undoing half of it.

# The one thing both profiles need: Harbor refuses to start without a browser to
# archive with, and the journeys stub MetadataResolver so they never reach one.
harbor.archive.browser-url=http://archiver.invalid:9222
